<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NoY — Coming soon</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="NoY atelier study — coming soon." />
  <meta name="theme-color" content="#f4eee6" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#f4eee6; --paper:#fffaf4; --ink:#2c322c; --muted:#7a8176;
      --garden:#4d5e4a; --lilac:#c4b0d0; --line:rgba(44,50,44,0.1); --accent:#9a7fa6;
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased;min-height:100vh}
    a{color:inherit;text-decoration:none}
    button{background:none;border:0;cursor:pointer;font:inherit;color:inherit}
    :focus-visible{outline:1.5px solid var(--accent);outline-offset:3px}
    .top{max-width:1100px;margin:0 auto;padding:22px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .brand{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;letter-spacing:0.42em;margin-right:-0.42em;font-weight:500}
    .lang-switch{display:inline-flex;align-items:center;gap:8px;font-size:10px;letter-spacing:0.22em;text-transform:uppercase}
    .lang-switch button{opacity:0.45;padding:4px 2px}
    .lang-switch button.is-active{opacity:1;border-bottom:1px solid var(--garden)}
    .lang-switch .sep{opacity:0.35}
    .stage{max-width:1100px;margin:0 auto;padding:12px 28px 80px;display:grid;grid-template-columns:1.15fr 0.85fr;gap:40px;align-items:center}
    .visual{position:relative;border-radius:3px;overflow:hidden;background:#efe6da;box-shadow:0 22px 60px rgba(77,94,74,0.14);min-height:520px}
    .visual img{width:100%;height:100%;object-fit:cover;display:block;min-height:520px;max-height:78vh}
    .copy{padding:12px 8px 12px 0}
    .kicker{font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
    h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:clamp(36px,5vw,56px);line-height:1.15;margin-bottom:18px}
    .poem{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:22px;color:var(--garden);margin-bottom:22px;max-width:28ch}
    .badge{display:inline-flex;flex-direction:column;gap:4px;padding:14px 18px;border:1px solid var(--line);background:rgba(255,250,244,0.7);backdrop-filter:blur(8px);margin-bottom:28px}
    .badge .en{font-size:11px;letter-spacing:0.24em;text-transform:uppercase}
    .badge .zh{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-size:20px;color:var(--muted)}
    .note{font-size:14px;color:var(--muted);max-width:36ch;margin-bottom:32px}
    .back{font-size:11px;letter-spacing:0.2em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:3px}
    .back:hover{color:var(--accent);border-color:var(--accent)}
    .wash{position:fixed;inset:0;pointer-events:none;z-index:-1;background:
      radial-gradient(circle at 15% 20%, rgba(233,223,239,0.55), transparent 42%),
      radial-gradient(circle at 85% 70%, rgba(159,175,144,0.28), transparent 40%)}
    .missing{max-width:640px;margin:80px auto;padding:40px;text-align:center}
    @media(max-width:860px){
      .stage{grid-template-columns:1fr;gap:28px;padding:8px 20px 64px}
      .top{padding:18px 20px}
      .visual,.visual img{min-height:420px}
    }
  </style>
</head>
<body>
  <div class="wash" aria-hidden="true"></div>
  <header class="top">
    <a class="brand" href="index.html">NoY</a>
    <div class="lang-switch" role="group" data-i18n-aria="lang.label" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <span class="sep" aria-hidden="true">|</span>
      <button type="button" data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </header>

  <main class="stage" id="piece-main" hidden>
    <div class="visual">
      <img id="piece-img" src="" alt="" width="1152" height="1440" />
    </div>
    <div class="copy">
      <p class="kicker" data-i18n="cs.kicker">Atelier study</p>
      <h1 id="piece-title"></h1>
      <p class="poem" id="piece-line"></p>
      <div class="badge" aria-label="Coming soon">
        <span class="en" data-i18n="cs.coming">Coming soon</span>
        <span class="zh" data-i18n="cs.coming.cn">即将上架</span>
      </div>
      <p class="note" data-i18n="cs.note">This study is resting until the first drop. No price, no cart—only light and cloth.</p>
      <a class="back" href="index.html#atelier" data-i18n="cs.back">Back to the garden</a>
    </div>
  </main>

  <div class="missing" id="piece-missing" hidden>
    <p class="kicker" data-i18n="cs.kicker">Atelier study</p>
    <h1 style="font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:40px;margin:12px 0 20px" data-i18n="cs.coming.cn">即将上架</h1>
    <p class="note" style="margin:0 auto 28px" data-i18n="cs.note"></p>
    <a class="back" href="index.html" data-i18n="cs.back">Back to the garden</a>
  </div>

  <script src="assets/i18n.js"></script>
  <script>
    (function () {
      const params = new URLSearchParams(location.search);
      const id = (params.get("piece") || "").trim();
      const pieces = window.NoYI18n.pieces;
      const main = document.getElementById("piece-main");
      const missing = document.getElementById("piece-missing");
      const img = document.getElementById("piece-img");
      const title = document.getElementById("piece-title");
      const line = document.getElementById("piece-line");
      const back = document.querySelectorAll(".back");

      function fill(lang) {
        const t = window.NoYI18n.t;
        document.title = t(lang, "cs.meta");
        if (!id || !pieces[id]) {
          main.hidden = true;
          missing.hidden = false;
          return;
        }
        missing.hidden = true;
        main.hidden = false;
        const p = pieces[id];
        img.src = p.img;
        img.alt = t(lang, p.cap);
        title.textContent = t(lang, p.cap);
        line.textContent = p.line[lang] || p.line.en;
        const hash = ["soft-tee","light-knit","fresh-cut"].includes(id) ? "#collection" : "#atelier";
        back.forEach((a) => { a.setAttribute("href", "index.html" + hash); });
      }

      window.NoYI18n.bindSwitcher();
      const lang = window.NoYI18n.detect();
      window.NoYI18n.apply(lang);
      fill(lang);
      document.addEventListener("noy:lang", (e) => fill(e.detail.lang));
    })();
  </script>
</body>
</html>
